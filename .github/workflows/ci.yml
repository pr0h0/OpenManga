name: CI

on:
  push:
    # staging too: its head is several squashed PRs combined, and each PR passing alone does not prove the combination.
    branches: [main, master, staging]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openmanga
          POSTGRES_PASSWORD: openmanga
          POSTGRES_DB: openmanga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openmanga" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: System packages (ffmpeg, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-comic-neue
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bunx biome ci .
      - name: Typecheck
        run: bunx tsc -p tsconfig.json --noEmit && bunx tsc -p apps/web/tsconfig.json --noEmit
      - name: Unit tests
        run: bun test packages apps/api apps/worker apps/web
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://openmanga:openmanga@localhost:5432/openmanga
          TEST_REDIS_URL: redis://localhost:6379/5
        run: bun test tests/integration --timeout 300000
      - name: Build web
        run: cd apps/web && bun run build
      - name: Build images
        run: docker build -f deploy/docker/app.Dockerfile -t openmanga-app:ci . && docker build -f deploy/docker/nginx.Dockerfile -t openmanga-nginx:ci .

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          fail=0
          for c in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            # Bots cannot sign off, and the DCO is a statement about a human's right to submit the work. A
            # dependency bump authored by Dependabot carries no such claim to make, so it is exempt.
            case "$author" in *"[bot]"*|*"bot@"*) echo "skipping bot commit ${c}"; continue;; esac
            if ! git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::${c} is missing \"Signed-off-by: ${author}\" — see CONTRIBUTING.md (git commit -s)"
              fail=1
            fi
          done
          exit $fail
