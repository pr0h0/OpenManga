worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    font/otf otf;
  }

  log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","requestId":"$request_id","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"latencyMs":$request_time,"upstreamMs":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Client IP: set per listener in default.conf (port 80 trusts CF-Connecting-IP from private networks, the
  # published port never does).

  # Backstop that does not depend on Redis: the application's own limiter fails open if Redis is unreachable, and
  # these three endpoints are the ones worth guessing at. Keyed on the effective client address (after real_ip).
  limit_req_zone $binary_remote_addr zone=auth_burst:10m rate=30r/m;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
