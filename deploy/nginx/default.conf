# Docker DNS with re-resolution: api containers get new IPs when recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
  zone api_upstream 64k;
  server api:3000 resolve;
  keepalive 32;
}

# Port 80 is what cloudflared (and any other container on the Docker networks) talks to. Only here may a proxy
# name the client: CF-Connecting-IP is believed when the request comes from a private address, i.e. from beside us.
server {
  listen 80 default_server;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  include /etc/nginx/conf.d/openmanga.inc;
}

# Port 8080 is the one published on the host (NGINX_BIND:NGINX_PORT). Connections through it arrive from the Docker
# bridge gateway, a private address, so trusting the header here let anyone who reached the port pick their own IP
# for the rate limits, the login lockout and the session list. Nothing in front of this port names the client.
server {
  listen 8080 default_server;
  include /etc/nginx/conf.d/openmanga.inc;
}
